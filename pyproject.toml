[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commerce"
version = "0.1.0"
description = "Educational product discovery with retrieval algorithms implemented from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
ai-commerce = "ai_commerce.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_commerce*"]

[tool.setuptools.package-data]
ai_commerce = ["data/*.json"]
