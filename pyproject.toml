[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commerce"
version = "0.1.0"
description = "Local product discovery and comparison application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["httpx2>=2,<3"]

[project.scripts]
ai-commerce = "ai_commerce.__main__:main"
ai-commerce-experiments = "experiments.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_commerce*", "retrieval*", "experiments*"]

[tool.setuptools.package-data]
ai_commerce = ["data/*.sqlite3"]
