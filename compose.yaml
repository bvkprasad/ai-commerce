services:
  app:
    image: ai-commerce:latest
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
  tests:
    image: ai-commerce:latest
    build: .
    profiles: ["test"]
    command: ["python", "-m", "unittest", "discover", "-v"]
    read_only: true
    tmpfs:
      - /tmp
